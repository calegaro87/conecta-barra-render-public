services:
  - type: web
    name: conecta-barra-api
    runtime: node
    region: virginia
    # IMPORTANTE: o plano "free" hiberna após ~15 min sem requisições HTTP e derruba todos os WebSockets;
    # com isso o tempo real e o disparo de push ficam intermitentes. Para funcionamento contínuo use um plano
    # pago (starter ou superior), que fica sempre ligado.
    plan: starter
    # O tempo real mantém os aparelhos conectados em memória: use SEMPRE 1 instância (sem autoescala),
    # a menos que adicione um broker (Redis) para espalhar os eventos entre instâncias.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Gere com `openssl rand -hex 32` e cadastre manualmente no Render.
      # Nunca coloque o valor no Git, no APK ou em respostas.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Token do Expo para o envio de push (https://expo.dev → Account settings → Access tokens).
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # Origens de NAVEGADOR autorizadas (vírgula). O app Android não precisa. Deixe vazio se não usa versão web.
      - key: ALLOWED_ORIGINS
        value: ""
